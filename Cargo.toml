[package]
name = "units"
version = "0.1.0"
edition = "2024"
authors = ["Your Name <your.email@example.com>"]
description = "Typed scalar SI values and unit-scale conversion for the star simulation"
homepage = "https://github.com/timjonaswechler/units"
repository = "https://github.com/timjonaswechler/units"
license = "MIT OR Apache-2.0"
keywords = ["physics", "units", "astronomy", "science", "simulation"]
categories = ["science", "mathematics"]

[dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }

[features]
default = []
serde = ["dep:serde"]

[dev-dependencies]
ron = "0.8"
serde_json = "1.0"
