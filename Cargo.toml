[package]
name = "units"
version = "0.1.0"
edition = "2024"
authors = ["Your Name <your.email@example.com>"]
description = "A type-safe, high-performance unit system with dimensional analysis for scientific computing"
homepage = "https://github.com/timjonaswechler/units"
repository = "https://github.com/timjonaswechler/units"
license = "MIT OR Apache-2.0"
keywords = [
    "physics",
    "units",
    "dimensional-analysis",
    "astronomy",
    "science",
    "rust",
    "mathematics",
    "engineering",
    "uom",
    "unit-of-measurement",
]
categories = ["science", "mathematics"]

[dependencies]
static_assertions = "1.1"
serde = { version = "1.0", optional = true }
paste = "1.0"

[features]
default = ["f64", "precision-6"]

# Value type selection (mutually exclusive)
f32 = []
f64 = []
f128 = []

# Precision configuration
precision-3 = []
precision-6 = []
precision-9 = []
precision-12 = []

# Display styles
compact = []
verbose = []
scientific = []

# Domain profiles (don't inherit defaults)
game = ["f32", "precision-3", "compact"]
science = ["f64", "precision-9", "scientific"]
physics = ["f128", "precision-12", "verbose"]

# Individual feature tests should disable defaults
test-f32 = ["f32"]
test-f64 = ["f64"]


# Optional features
serde = ["dep:serde"]

[dev-dependencies]
serde_json = "1.0"

# Examples will be added later
