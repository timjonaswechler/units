[package]
name = "units"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "A type-safe, high-performance unit system with dimensional analysis for scientific computing"
homepage = "https://github.com/timjonaswechler/units"
repository = "https://github.com/timjonaswechler/units"
license = "MIT OR Apache-2.0"
keywords = [
    "physics",
    "units",
    "dimensional-analysis",
    "astronomy",
    "science",
    "rust",
    "mathematics",
    "engineering",
    "uom",
    "unit-of-measurement",
]
categories = ["science", "mathematics"]

[dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }
paste = "1.0"

[features]
default = ["serde"]
serde = ["dep:serde"]

[dev-dependencies]
serde_json = "1.0"

